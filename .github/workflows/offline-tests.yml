name: Offline ChatLab checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline CLI smoke test
        run: |
          printf 'Hello\n/model test/example\nOne more prompt\n/quit\n' | python chatlab.py --dry-run
